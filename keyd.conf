###############################################################################
# keyd Configuration
#
# Philosophy:
# - Keep hands on the home row.
# - Minimize finger travel.
# - Use the Alt layer for frequently used shortcuts.
# - Support both WASD and Vim-style navigation.
# - Optimize for browsing, coding, and everyday desktop use.
###############################################################################
[global]
overload_tap_timeout = 150

[ids]
# Apply this configuration to all keyboards.
*

[main]
###############################################################################
# Default Layer
###############################################################################

# Tap: Escape
# Hold: Left Control
#
# Makes Ctrl shortcuts effortless while keeping Escape within easy reach.
capslock = overload(meta, esc)
rightalt=leftmeta


[alt]
###############################################################################
# Alt Layer
#
# Hold Left Alt to access this layer.
###############################################################################

###############################################################################
# Misc
###############################################################################

l=C-l
9=S-9
0=S-0
apostrophe=S-apostrophe

###############################################################################
# Utilities
###############################################################################

# Open the browser's emoji picker.
#
# Firefox (and many Chromium-based browsers) use Ctrl+. to open
# the emoji/symbol picker.
o = C-dot

# Find/Search in almost any application.
#
# Works in browsers, editors, PDFs, file managers, terminals, and more.
f = C-f


###############################################################################
# Typing
###############################################################################

# Easier-to-reach Enter keys while using the Alt layer.
capslock = enter
; = enter


###############################################################################
# Browser Shortcuts
###############################################################################

# Open a new tab.
t = C-t

# Switch to the next tab.
q = C-tab


###############################################################################
# Clipboard
###############################################################################

# Copy selected content.
c = C-c

# Paste clipboard contents.
v = C-v

# Cut selected content.
x = C-x


###############################################################################
# Editing
###############################################################################

# Undo the last action.
u = C-z

# Redo the last undone action.
y = C-y

# Backspace without leaving the home row.
e = backspace


###############################################################################
# Cursor Navigation (WASD)
###############################################################################

# Arrow keys under the left hand.

w = up
a = left
s = down
d = right


###############################################################################
# Cursor Navigation (Vim)
###############################################################################

# Traditional Vim movement.

h = left
j = down
k = up
l = right


###############################################################################
# Media Controls
###############################################################################

# Control music without dedicated multimedia keys.

1 = previoussong
2 = playpause
3 = nextsong


[alt+shift]
###############################################################################
# Alt + Shift Layer
###############################################################################

# Close the current browser tab.
w = C-w

# Text selection
a = C-a

# Delete the previous word.
#
# Equivalent to Ctrl+Backspace.
e = C-backspace
